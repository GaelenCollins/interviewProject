# Netlify — Vite SPA frontend only.
# Set ONLY: VITE_API_BASE_URL=https://interviewprojectapi.onrender.com
# Do NOT set ANTHROPIC_API_KEY / CLAUDE_* / API_PORT here — those belong
# on Render. Keeping ANTHROPIC_API_KEY in Netlify makes secrets scanning
# fail the build even though the key is unused by the Vite bundle.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # VITE_* values are public by design and appear in the JS bundle.
  # Omit them so secrets scanning does not fail the deploy.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_BASE_URL"
  SECRETS_SCAN_OMIT_PATHS = ".env.example"

# Optional: reverse-proxy /api to your API host instead of using
# VITE_API_BASE_URL. Uncomment and set the destination:
#
# [[redirects]]
#   from = "/api/*"
#   to = "https://YOUR-API-HOST/api/:splat"
#   status = 200
#   force = true

# SPA fallback (must stay after any /api proxy rules)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
